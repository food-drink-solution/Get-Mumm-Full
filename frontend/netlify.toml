# Netlify Configuration for Frontend Deployment

[build]
  # Build command (no need to cd frontend, already there)
  command = "pnpm install && pnpm build"
  
  # Publish directory where Vite outputs production build
  publish = "dist"
  
  # Node version to use - MUST be 20.19+ or 22.12+ for Vite 8
  node_version = "20.19.0"

[build.environment]
  BASE_PATH = "/"
  # Disable service worker by default to avoid message port errors
  VITE_ENABLE_SW = "false"

# SPA (Single Page App) routing - redirect 404s to index.html for Wouter routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache control for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# No cache for HTML
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
